plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erickbarbosa.rupturainfinita'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.erickbarbosa.rupturainfinita'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '0.12.0'
        def apiBaseUrl = project.hasProperty('riApiBaseUrl')
                ? project.property('riApiBaseUrl').toString()
                : 'https://mobile-marvel-8qex.onrender.com'
        if (apiBaseUrl && !apiBaseUrl.toString().startsWith('https://')) {
            throw new GradleException('riApiBaseUrl must use HTTPS; local cleartext networking is not enabled')
        }
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            assets.srcDir('../../shared')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }

    // Release signing is opt-in and reads credentials only from the local process environment.
    // Without these variables Gradle still builds an unsigned release for local verification.
    def releaseStoreFile = System.getenv('RI_RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('RI_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('RI_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('RI_RELEASE_KEY_PASSWORD')
    if ([releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

services:
  - type: web
    name: marvel-ruptura-infinita-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --require-hashes -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: COMIC_VINE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
